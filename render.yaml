services:
  - type: web
    name: silimu-django
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn silimu.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"